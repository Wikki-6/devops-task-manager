name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show current directory
        run: pwd

      - name: List all files
        run: ls -la

      - name: Verify project files
            - name: Verify HTML content
        run: |
          grep -q "DevOps Task Manager" index.html
          echo "HTML content verified successfully."
      
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          echo "All required project files are present."

      - name: Display message
        run: echo "GitHub Actions CI is working successfully!"
